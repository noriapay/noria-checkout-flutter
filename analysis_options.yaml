# Lint baseline for the Noria Checkout SDK.
#
# Starts from the Flutter team's recommended set and layers the stricter
# rules that matter for a library consumed by third parties: every public
# member is documented, futures are never dropped and implicit dynamic is
# rejected.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote the checks that hide real bugs from warning to error so CI fails.
    missing_return: error
    unawaited_futures: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    invalid_use_of_visible_for_testing_member: error
    public_member_api_docs: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # API surface
    - public_member_api_docs
    - always_declare_return_types
    - avoid_positional_boolean_parameters
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - type_annotate_public_apis
    - use_setters_to_change_properties

    # Correctness
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_statements
    - use_build_context_synchronously

    # Style
    - always_put_required_named_parameters_first
    - avoid_bool_literals_in_conditional_expressions
    - avoid_catches_without_on_clauses
    - avoid_redundant_argument_values
    - avoid_unused_constructor_parameters
    - directives_ordering
    - eol_at_end_of_file
    - join_return_with_assignment
    - prefer_asserts_with_message
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - sort_pub_dependencies
    - sort_unnamed_constructors_first
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_if_null_to_convert_nulls_to_bools
    - use_named_constants
