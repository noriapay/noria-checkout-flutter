name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce coverage floor
        run: |
          total=$(awk -F: '/^LF/{lf+=$2} /^LH/{lh+=$2} END{printf "%d", (lh/lf)*100}' coverage/lcov.info)
          echo "Line coverage: ${total}%"
          test "$total" -ge 85

      - name: Example - install dependencies
        working-directory: example
        run: flutter pub get

      - name: Example - analyze and test
        working-directory: example
        run: |
          flutter analyze --fatal-infos --fatal-warnings
          flutter test --reporter expanded

      - name: Example - build web
        working-directory: example
        run: flutter build web --release --no-tree-shake-icons

      - name: Verify version consistency
        run: |
          pubspec=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          dart_version=$(grep -oE "'[0-9]+\.[0-9]+\.[0-9]+[^']*'" lib/src/version.dart | tr -d "'")
          echo "pubspec=$pubspec version.dart=$dart_version"
          test "$pubspec" = "$dart_version"
          grep -q "## \[$pubspec\]" CHANGELOG.md
